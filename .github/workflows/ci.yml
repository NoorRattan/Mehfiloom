name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Mehfiloom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --project frontend/tsconfig.json --noEmit --incremental false

      - name: Build production app
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Report full dependency audit
        run: node backend/scripts/report-full-audit.mjs
